name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy sample_1

      - name: Test
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Build production image
        run: docker build -f Dockerfile-prod -t change-machine:${{ github.sha }} .

      - name: Smoke test the image
        run: |
          docker run -d --name cm -p 5000:5000 --read-only --tmpfs /tmp change-machine:${{ github.sha }}
          for i in $(seq 1 20); do curl -fsS http://localhost:5000/healthz && break; sleep 1; done
          curl -fsS "http://localhost:5000/api/v1/change?amount=1.23" | grep -q '"total":"1.23"'
          docker rm -f cm
