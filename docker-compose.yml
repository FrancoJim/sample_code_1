services:
  web-dev:
    build:
      context: .
      dockerfile: Dockerfile-dev
    ports:
      - "${HOST_PORT:-5000}:5000"
    env_file:
      - example.env
    volumes:
      - .:/app
    profiles:
      - dev

  web-prod:
    image: change-machine:latest
    build:
      context: .
      dockerfile: Dockerfile-prod
    ports:
      - "${HOST_PORT:-5000}:5000"
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    profiles:
      - prod
