[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sample_code_1"
version = "1.4.0"
description = "USD coin/bill change calculator — web app and REST API"
authors = [{name = "Kevin Lang", email = "k.j.lang.tech@gmail.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.15",
    "mypy>=1.15",
]

[project.urls]
Homepage = "https://github.com/FrancoJim/sample_code_1"

[tool.setuptools.packages.find]
where = ["."]
include = ["sample_1*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=sample_1 --cov-report=term-missing"
